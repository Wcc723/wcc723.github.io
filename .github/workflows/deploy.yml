# 部落格的建置、對等檢查與部署（P2 起）。
# push main 時：npm ci → npm test → npm run build（postbuild 跑 scripts/audit-build.mjs，沒過就失敗）→ 上傳 Pages artifact
# → deploy job 用 actions/deploy-pages 部署到 www.casper.tw。build 沒過就不會部署，線上維持上一版。
#
# 前提（workspace 的 docs/runbooks/blog-cutover.md 第 3、4 步，站長在 GitHub 後台做）：main 是預設分支、
# Pages Source 是 GitHub Actions、github-pages 環境允許 main。回退：Pages Source 切回從 master 分支部署。
name: Build, audit and deploy

on:
  push:
    branches: [main]

# 最小權限：只需要讀 repo。上傳 artifact 用的是 Actions 自己的 token，不需要額外權限。
permissions:
  contents: read

# 同一時間只跑一組。照 GitHub Pages 範本的做法不取消進行中的那一次（P2 加上部署後，部署不能被砍到一半），
# 排隊中的舊 run 會被新的 push 取代。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # audit 要讀基準 commit（Hexo 產物）的原始 HTML 來比本文與卡片；checkout 只抓 main，這裡單獨抓那一個 commit。
      # commit 由 audit 從 baseline/ 最新的 hexo-* 讀出，不在這裡寫死。要在 npm ci 之後跑（audit 會 import 套件）。
      # 先存進變數：腳本失敗時這一步直接失敗。寫在 fetch 的參數裡時失敗會變成空字串，
      # git fetch 改抓預設分支、步驟照樣成功（2026-11-05 預設分支改成 main 後就這樣讀不到基準）。
      - name: 抓基準 commit
        run: |
          commit="$(node scripts/audit-build.mjs --print-baseline-commit)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "基準 commit 不對：'$commit'"; exit 1; }
          git fetch --no-tags --depth=1 origin "$commit"

      - run: npm test

      # postbuild 會接著跑 scripts/audit-build.mjs，報告寫在 source/.vitepress/cache/audit-report.json
      - run: npm run build

      - name: 保留 audit 報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: source/.vitepress/cache/audit-report.json
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write      # 部署到 Pages
      id-token: write   # deploy-pages 用 OIDC 驗證
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
